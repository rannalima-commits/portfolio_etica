<html lang="pt-BR"><head><meta charset="utf-8">

<title>Portfólio de Ética e Direitos Humanos</title>
<style>
:root{--bg:#1b2a3a;--fl:#2b4257;--wl:#0e1722;--tx:#f3efe6;--ac:#f2b544;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,serif;text-align:center;user-select:none;-webkit-user-select:none}
h1{font-size:1.15rem;margin:10px 8px 2px}
p.s{margin:0 8px 8px;font-size:.85rem;opacity:.8}
#g{display:grid;grid-template-columns:repeat(15,var(--t));margin:0 auto;width:max-content;border:3px solid var(--wl);--t:min(6.2vw,38px)}
.c{width:var(--t);height:var(--t);display:flex;align-items:center;justify-content:center;font-size:calc(var(--t)*.7);background:var(--fl)}
.c.w{background:var(--wl)}.c.v{opacity:.35}
#pad{display:grid;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;margin:12px auto}
#pad button{height:52px;font-size:1.4rem;border-radius:12px;border:0;background:var(--fl);color:var(--tx)}
#cnt{font-size:.95rem;margin-top:6px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#b{background:#f7f2e7;color:#222;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px;text-align:left;line-height:1.5;user-select:text;-webkit-user-select:text}
#b h2{margin:0 0 4px;font-size:1.1rem}#b small{color:#777}
#b p{margin:.6em 0;font-size:.95rem}
#b button{background:var(--ac);border:0;border-radius:10px;padding:10px 18px;font-size:1rem;margin-top:8px}
.fall{animation:f .6s}@keyframes f{50%{transform:scale(.6) rotate(20deg)}}
</style></head><body>

1:{t:"🚪",d:"18/08/2026",h:"O que é ética?",x:["Ética, para mim, seria pensar na forma que agimos quando essas nossas ações podem afetar outras pessoas. É o pensar em mim e em você. É o tentar pensar no que é certo. Porém, daí que surge o dilema. Não é tão simples definir o que é o “certo” em cada situação, principalmente quando estamos lidando com tentar encontrar o menor de todos os danos. Ética é algo mais controverso do que parece.","<b>Situação do cotidiano (grupo: Anna Clara, Lílian Vieira, Luiza Amorim, Maria Eduarda e Ranna Carvalho):</b> pessoas em situação de rua.","A mera existência de pessoas em situação de rua evidencia de forma contundente a distância entre os direitos humanos assegurados e a realidade vivenciada por muitas pessoas. A ausência de direitos básicos, como moradia, saúde, alimentação e dignidade, expõe esses indivíduos a condições extremas de vulnerabilidade, também reflexos da desigualdade social, o que torna a própria sobrevivência uma luta cotidiana. Diante disso, em cenários como esse, a falta de acesso a direitos básicos, garantidos constitucionalmente, só evidencia que na prática as políticas públicas têm muito a melhorar. Nesse sentido, a psicologia se fortalece ao buscar a colaboração com outras áreas, como a assistência social, a fim de garantir a proteção social, o apoio psicossocial e o fortalecimento de vínculos, indo além da imagem tradicional da clínica psicológica. Como exemplo, serviços como os Centros POPs (Centro de Referência Especializado para População em Situação de Rua) oferecem atendimento especializado, multidisciplinar e diário a pessoas em situações de vulnerabilidade. Nessas unidades públicas de assistência social, os psicólogos buscam basear a atuação para além dos fatores clínicos aparentes, olhando também para o contexto social de cada usuário. Formando, assim, uma rede interseccional e integrada de cuidado que visa alcançar esses direitos em primeiro lugar."]},
2:{t:"🕳️",d:"25/08/2026",h:"Estágios da moralidade e prática",q:"Considerando os diferentes estágios e abordagens da moralidade apresentados no texto (como a heteronomia baseada na obediência e a busca pela autonomia racional), como você pensa e percebe essas diferentes posturas morais em situações do cotidiano ou profissionais?",x:["Percebo essas posturas morais o tempo todo, e acho que muitas vezes na mesma pessoa, dependendo da situação, inclusive em mim mesma. A heteronomia aparece quando a gente faz algo certo só porque tem alguém olhando ou porque existe uma punição. É o colega que não cola na prova porque o professor está na sala, ou o influencer que faz caridades só porque muitas pessoas verão essa atitude. Já a autonomia eu enxergo quando alguém age certo mesmo sem ninguém saber, porque entendeu o sentido da coisa e faz dela um princípio seu. Pensando na psicologia, o sigilo profissional é um bom exemplo. Dá pra guardar sigilo porque o código de ética manda, ou porque a gente compreende que sem confiança não existe vínculo terapêutico. O comportamento é o mesmo, mas o fundamento é bem diferente. O que mais me marcou no texto é que a autonomia também tem a ver com sentir vergonha, empatia, querer ser alguém digno aos próprios olhos. E acho que muita gente, eu inclusive, vive no meio do caminho, seguindo algumas regras no automático e questionando outras."]},
3:{t:"🚪",d:"01/09/2026",h:"O que é “menor dano”?",q:"A partir do que foi discutido em classe sobre o Código de Ética, como você definiria, com suas próprias palavras, o que é \"menor dano\" na prática psicológica?",x:["Para mim, “menor dano\" é quando eu não tenho uma saída perfeita de uma situação e preciso escolher o caminho que machuque menos as pessoas ao meu redor, ou quem quer que esteja envolvido. Não é evitar todo o sofrimento, porque às vezes isso não dá, e sim não causar um sofrimento a mais do que o necessário. Sigo com o mesmo exemplo do disparador anterior. Em regra, o psicólogo não deve comunicar informações sobre seus pacientes, mas existem certas situações de risco, como quando a vida da pessoa está em perigo, em que talvez seja preciso quebrar esse sigilo. Nesse caso, a ideia do menor dano é contar só o essencial, pra quem realmente precisa saber e possa ajudá-la, mas não abrir a vida inteira do paciente."]},
4:{t:"🕳️",d:"08/09/2026 e 15/09/2026",h:"Lacunas no Código de Ética",q:"Refletindo sobre o Código de Ética do CRP, qual(quais) lacuna(s) você consegue identificar? De que maneira você crê que isso pode refletir na prática profissional?",x:["A lacuna que mais me chamou atenção é que o Código fala de sigilo, mas não deixa claro como ele fica nesses espaços mais modernos de WhatsApp e Instagram, por exemplo. Numa situação em que o paciente manda uma mensagem de madrugada precisando urgente de ajuda, como o psicólogo procede? Qual o limite do sigilo já que existe essa plataforma em que garantir isso não está totalmente no controle do profissional? E se o psicólogo posta algo sobre a profissão e o paciente se reconhece ali? Na prática, isso pode fazer cada profissional resolver do seu jeito, e quem está começando pode acabar expondo o paciente sem perceber. A segunda é que o texto é bem geral, fala de princípios, mas não dá muita orientação para os casos difíceis do dia a dia. Acho que faltam alguns exemplos práticos."]},
5:{t:"🖼️",d:"22/09/2026",h:"Colagem: O Brasil surreal",x:["Neste dia, a reflexão foi feita em colagem: um painel azul com o título <b>“O Brasil surreal”</b>, com recortes sobre refugiados, lixo, desigualdade e educação, e no centro várias mãos entrelaçadas formando a palavra <b>ética</b>.",'<img src="'+IMG+'" alt="Colagem O Brasil surreal" style="width:100%;border-radius:8px">']},
6:{t:"🚪",d:"29/09/2026",h:"Sexualidades e compromisso ético-político",q:"Com base nas discussões em sala, nas resoluções, campanhas e materiais orientadores do CFP, elabore uma análise crítica sobre o compromisso ético da Psicologia na promoção dos direitos humanos, no combate à discriminação e no acolhimento das pessoas LGBTQIA+.",x:["Na minha leitura, o compromisso ético-político da psicologia trabalha com a ideia de que ficar neutro diante do preconceito mantém a estrutura como está, e o Guia do CRP, usado como referência, diz que a violência LGBTfóbica atravessa as práticas de todos os campos de atuação e atenta contra a integridade e a autonomia dessas pessoas. Por isso, segundo o próprio CRP-03, o trabalho do psicólogo é olhar o sofrimento a partir do contexto social. Quem causa e mantém esse sofrimento é uma sociedade trans-lesbo-homofóbica, e redirecionar o desejo de alguém fica fora do que cabe à Psicologia.","Também compreendo que uma resolução sozinha não garante mudança, ou seja, o próprio Guia reconhece que a norma de 1999 (a que veta que os profissionais da Psicologia exerçam qualquer atividade que favoreça a patologização de comportamentos ou práticas homoafetivas e de que promovam práticas de terapias na linha da “cura gay”) não bastou para barrar práticas antiéticas e que ela foi atacada na justiça e no legislativo por setores conservadores. Se o profissional segue a regra só por medo de punição, isso lembra a heteronomia que discutimos em sala. A Psicologia precisa de profissionais que entendam o motivo da regra e a assumam como princípio, e isso depende de formação em gênero e sexualidades desde a graduação, e de acolhimento no dia a dia, como usar o nome social, não presumir que todo paciente é heterossexual e não patologizar.","<small>Referências: CONSELHO REGIONAL DE PSICOLOGIA 3ª REGIÃO – BAHIA. Psicologia, sexualidades e identidade de gênero: guia de referências técnicas e teóricas. Salvador: CRP-03, 2018. CFP, Resolução nº 1/1999, nº 1/2018 e nº 8/2022.</small>"]},
7:{t:"🕳️",d:"13/10/2026",h:"Dilemas e quebra de sigilo",x:["O sigilo profissional é um dos pilares da Psicologia, pois permite construir uma relação de confiança e segurança (estabelecer rapport) com a pessoa atendida. No entanto, compreendemos que ele não é absoluto e que existem situações em que a proteção da vida e dos direitos humanos pode exigir uma intervenção. Em casos de ideação suicida, por exemplo, ou em casos de violência contra a mulher e violência contra crianças e adolescentes, o profissional precisa avaliar cada situação, considerando os riscos e as possíveis consequências de suas decisões. Acredito que esse seja um dos maiores desafios da profissão, pois podem surgir sentimentos de angústia, medo, insegurança e impotência. Afinal, como respeitar a autonomia de alguém sem deixar de considerar a necessidade de proteger sua vida? Nem sempre existe uma resposta simples, e cada pessoa precisa ser compreendida dentro de sua própria realidade, sem julgamentos.","Outro ponto importante é entender que o psicólogo não precisa lidar com essas situações sozinho. A articulação com a rede de cuidado, como os serviços de saúde, assistência social e Conselho Tutelar, pode ser essencial para garantir a proteção e a continuidade do acompanhamento. Essas decisões podem afetar a confiança da pessoa atendida, mas também podem representar uma oportunidade de preservar sua vida e sua integridade.","Essa aula me fez perceber que ser psicólogo exige sensibilidade, responsabilidade e preparo para lidar com situações delicadas. É necessário enxergar a pessoa por trás de cada situação, respeitando sua história e sua autonomia, sem deixar de agir quando sua vida ou seus direitos estiverem em risco. Entendo que a ética profissional está justamente nesse equilíbrio entre acolher, respeitar e proteger."]},
8:{t:"🚪",d:"20/10/2026 e 27/10/2026",h:"Experiência do relatório",q:"Como foi a experiência de realização do relatório psicológico (baseado no filme Provoked)? Impressões, dificuldades, dúvidas, considerando o que o manual de elaboração recomenda.",x:["A experiência de elaboração do relatório psicológico foi muito importante porque nos permitiu enxergar, na prática, toda a responsabilidade e a complexidade que estão envolvidas na construção de um documento psicológico. É necessário organizar as informações de maneira técnica, ética e cuidadosa, seguindo as orientações do manual de elaboração de documentos psicológicos e da Resolução CFP nº 06/2019, sendo sucinto o suficiente para não expor a pessoa, mas colocando as informações necessárias.","Uma das principais dificuldades foi transformar os acontecimentos apresentados no filme em uma análise psicológica, com muita coisa precisando ser inventada e também sem deixar que as impressões pessoais interferissem. Também tive dúvidas sobre como utilizar os termos técnicos. Mas para além disso, o trabalho nos fez refletir sobre a importância de considerar o contexto social, cultural e histórico da pessoa atendida, evitando julgamentos e interpretações superficiais. Com essa atividade, compreendi melhor que um relatório psicológico exige responsabilidade, fundamentação teórica, linguagem objetiva e compromisso ético, pois pode produzir consequências importantes na vida de quem é avaliado."]},
9:{t:"🕳️",d:"13/11/2026",h:"Ética na divulgação profissional",x:['<img src="'+IMG2+'" alt="Exemplo de divulgação não ética" style="width:100%;max-width:340px;display:block;margin:8px auto;border-radius:8px">',"Este é um exemplo de divulgação profissional não ética. A primeira imagem apresenta uma publicidade inadequada, utilizando frases como \"Livre-se da ansiedade em poucas sessões\" e \"resultados garantidos\", além de oferecer um pacote promocional de quatro sessões com desconto. Essas práticas contrariam diretamente o Código de Ética. A promessa de resultados garantidos viola as diretrizes de divulgação profissional do Código de Ética, que proíbe a previsão taxativa de resultados, uma vez que cada pessoa possui suas particularidades e o processo terapêutico não pode garantir resultados ou estabelecer um prazo fixo para a melhora. Já a oferta de descontos e pacotes promocionais também viola as diretrizes que proíbem a utilização do preço do serviço como forma de propaganda. Na minha percepção, esse tipo de divulgação transforma o sofrimento psicológico em uma oportunidade comercial, podendo criar expectativas irreais em pessoas que procuram ajuda. A Psicologia deve ser divulgada com responsabilidade, respeitando a individualidade de cada pessoa e a seriedade do processo terapêutico.",'<img src="'+IMG3+'" alt="Exemplo de divulgação adequada" style="width:100%;max-width:340px;display:block;margin:8px auto;border-radius:8px">',"Este é um exemplo de divulgação profissional adequada, pois orienta que a psicóloga informe seu nome completo ou nome social, sua identificação profissional (Psicóloga ou Psicólogo) e o número de registro no Conselho Regional de Psicologia (CRP). Essas informações estão de acordo com o Código de Ética Profissional do Psicólogo, que estabelece a obrigatoriedade dessa identificação na divulgação dos serviços. A publicação também explica que o profissional deve divulgar apenas títulos e qualificações que realmente possui, conforme o Código. Considero essa orientação importante porque transmite transparência e responsabilidade, e isso permite que as pessoas identifiquem o profissional e verifiquem sua habilitação para exercer a Psicologia.","<b>Parte 2 – Projeção profissional</b>","Pretendo atuar na Psicologia Organizacional e do Trabalho. Minha divulgação deve ser parecida com o exemplo adequado que escolhi, sendo discreta, só com meu nome, minha identificação como psicóloga, o número do CRP e minha formação. Quero que quem me procure encontre informação clara e verdadeira, e que a confiança venha do trabalho que eu fizer.","Na área organizacional, vejo alguns cuidados que não podem faltar. Nada de promessas como \"aumento garantido de produtividade\", por exemplo, porque eu lido com pessoas e com um contexto que não depende só de mim. O sigilo também exige atenção. Os casos, os depoimentos e as imagens de trabalhadores não entram na divulgação se alguém puder ser reconhecido, e a empresa contratante só aparece com autorização. No começo do trabalho, pretendo deixar claro quem é o cliente, quais são os objetivos e o que pode ser compartilhado com a organização, para o trabalhador saber o que vai chegar à gestão, com o mínimo necessário de informação. Se os interesses da empresa e dos trabalhadores entrarem em conflito, minha referência continua sendo o Código de Ética e a defesa dos direitos humanos."]},
A:{t:"🚪",d:"17/11/2026",h:"Visita do CRP",q:"Que reflexões foram geradas a partir da visita institucional do CRP? Como você poderia descrever o que torna uma pessoa psicólogo/a?",x:["A visita do Conselho Regional de Psicologia foi importante para entendermos melhor as responsabilidades que teremos depois de formados e formadas. Compreendemos a necessidade do registro ativo para exercer legalmente a profissão. Também aprendemos sobre os procedimentos necessários após a graduação, os documentos utilizados na Psicologia e a importância de elaborá-los corretamente. Outro ponto que achei interessante foi a discussão sobre o contrato terapêutico, que pode ser verbal ou escrito (sendo mais aconselhado usar as duas formas), mas precisa deixar claros os combinados entre profissional e paciente, como horários, valores, faltas e funcionamento dos atendimentos. Além disso, conversamos sobre as penalidades que podem ocorrer quando o profissional descumpre o Código de Ética e sobre os cuidados necessários na divulgação do trabalho, como não prometer resultados, não utilizar preços como propaganda e apresentar informações verdadeiras sobre sua formação.","A aula me fez perceber que ser psicóloga vai muito além de ter conhecimento teórico, realizar atendimentos ou ter um diploma. É preciso também ter responsabilidade, compromisso ético, respeitar os limites da profissão e estar sempre atenta às questões únicas de cada indivíduo. Foi uma oportunidade de conhecer melhor a realidade profissional e entender os cuidados que precisaremos ter quando começarmos a atuar."]}
};
const $=id=>document.getElementById(id);
let pos,seen=new Set(),open=false,g=$("g"),cells=[];
MAP.forEach((r,y)=>[...r].forEach((ch,x)=>{const c=document.createElement("div");c.className="c"+(ch=="#"?" w":"");
 if(R[ch])c.textContent=R[ch].t;if(ch=="G")c.textContent="🏁";g.appendChild(c);cells.push(c);
 if(ch=="P")pos=[x,y]}));
const start=[...pos],ix=(x,y)=>y*15+x;
function draw(prev){cells.forEach(c=>{if(c.dataset.p){c.dataset.p="";c.textContent=c.dataset.o||""}});
 const c=cells[ix(...pos)];c.dataset.o=c.textContent;c.dataset.p=1;c.textContent="🧍‍♀️";
 $("cnt").textContent="Reflexões encontradas: "+seen.size+" / 10"}
function show(html){open=true;$("b").innerHTML=html;$("m").style.display="flex"}
function close_(){open=false;$("m").style.display="none"}
function end(){show("<h2>🏁 Você chegou!</h2><p>Você passou por todas as reflexões do semestre: o que é ética, heteronomia e autonomia, o menor dano, as lacunas do Código, a colagem, sexualidades, sigilo, o relatório, a divulgação profissional e a visita do CRP.</p><p>Obrigada por jogar este portfólio. 💙</p><button onclick='close_()'>Fechar</button>")}
function step(dx,dy){if(open)return;const nx=pos[0]+dx,ny=pos[1]+dy,ch=MAP[ny][nx];if(ch=="#")return;
 pos=[nx,ny];draw();
 if(R[ch]&&!seen.has(ch)){const r=R[ch],hole=r.t=="🕳️";seen.add(ch);if(hole){land=LAND[ch];open=true}cells[ix(nx,ny)].classList.add("v");
  const body=(r.q?"<p><i>Disparador: "+r.q+"</i></p>":"")+r.x.map(t=>"<p>"+t+"</p>").join("");
  const html="<h2>"+r.h+"</h2><small>"+r.d+"</small>"+body+"<button onclick='close_();"+(hole?"back()":"")+"'>Continuar</button>";
  if(hole){const c=cells[ix(nx,ny)];c.classList.add("fall");setTimeout(()=>{c.classList.remove("fall");show("<h2>😵 Você caiu no buraco!</h2>"+html.slice(html.indexOf("<small")))},500)}
  else show(html);draw()}
 if(ch=="G"){if(seen.size<10)show("<h2>🔒 Portão trancado</h2><p>Faltam "+(10-seen.size)+" reflexões. Explore as portas 🚪, os buracos 🕳️ e o mural 🖼️.</p><button onclick='close_()'>Voltar</button>");else end()}}
function back(){pos=[...land];draw()}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener("keydown",e=>{const k=K[e.key];if(k){e.preventDefault();step(...k)}});
document.querySelectorAll("#pad button").forEach(b=>b.addEventListener("click",()=>step(...{u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[b.dataset.d])));
draw();
